name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and package release artifact
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          AIRCHAT_KEYSTORE_BASE64: ${{ secrets.AIRCHAT_KEYSTORE_BASE64 }}
          AIRCHAT_KEYSTORE_PASSWORD: ${{ secrets.AIRCHAT_KEYSTORE_PASSWORD }}
          AIRCHAT_KEY_ALIAS: ${{ secrets.AIRCHAT_KEY_ALIAS }}
          AIRCHAT_KEY_PASSWORD: ${{ secrets.AIRCHAT_KEY_PASSWORD }}
        run: |
          if [[ -n "${AIRCHAT_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$AIRCHAT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/airchat-release.jks"
            export AIRCHAT_KEYSTORE="$RUNNER_TEMP/airchat-release.jks"
            bash ./scripts/package-signed-release.sh "$RELEASE_VERSION"
          else
            bash ./scripts/package-debug-release.sh "$RELEASE_VERSION"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: airchat-release
          path: release/*
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft \
            --title "AirChat $GITHUB_REF_NAME" \
            --notes-file release/RELEASE_NOTES.md
