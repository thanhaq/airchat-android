name: Bug report
description: Report a reproducible problem in AirChat.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact steps and devices involved.
      placeholder: |
        1. Open AirChat on device A.
        2. Open AirChat on device B.
        3. Connect both to the same offline hotspot.
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: AirChat diagnostics
      description: Tap the info icon in AirChat and paste the shared diagnostics text from each device.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logcat lines or attach screenshots.
