name: Feature request
description: Suggest a feature or transport improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or field condition does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - LAN transport
        - Wi-Fi Direct
        - Wi-Fi Aware
        - Protocol
        - Crypto
        - UI
        - Documentation
    validations:
      required: true
