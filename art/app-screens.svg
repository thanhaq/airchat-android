<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-label="AirChat Android app screens showing room chat, peer verification, and file sharing">
  <rect width="1440" height="760" rx="0" fill="#F7F8FA"/>
  <text x="72" y="88" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">Offline Wi-Fi chat, built for the field</text>
  <text x="74" y="132" fill="#475467" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">LAN discovery, Wi-Fi Direct, signed packets, encrypted DMs, file transfer, and background relay.</text>

  <g transform="translate(96 188)">
    <rect x="0" y="0" width="344" height="512" rx="38" fill="#101828"/>
    <rect x="14" y="18" width="316" height="476" rx="28" fill="#F7F8FA"/>
    <rect x="14" y="18" width="316" height="76" rx="28" fill="#FFFFFF"/>
    <text x="38" y="55" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">AirChat</text>
    <text x="38" y="79" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">peer-b71a / 7Pda9sMq2L</text>
    <circle cx="262" cy="57" r="12" fill="#25C2A0"/>
    <circle cx="294" cy="57" r="12" fill="#3451B2"/>

    <g transform="translate(34 118)">
      <rect width="126" height="34" rx="17" fill="#E7F7F2"/>
      <circle cx="22" cy="17" r="8" fill="#00856F"/>
      <text x="40" y="23" fill="#006B59" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">LAN Ready</text>
      <rect x="142" width="150" height="34" rx="17" fill="#EBF0FF"/>
      <circle cx="164" cy="17" r="8" fill="#3451B2"/>
      <text x="182" y="23" fill="#263C8A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Direct Ready</text>
    </g>

    <g transform="translate(34 178)">
      <rect x="0" y="0" width="218" height="60" rx="14" fill="#FFFFFF"/>
      <text x="16" y="24" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">maya</text>
      <text x="16" y="45" fill="#344054" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">relay test from hotspot</text>
      <rect x="74" y="80" width="218" height="66" rx="14" fill="#00856F"/>
      <text x="92" y="105" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">me</text>
      <text x="92" y="127" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">works with no internet</text>
      <text x="92" y="145" fill="#DDF7F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">lobby / sent</text>
      <rect x="0" y="168" width="190" height="60" rx="14" fill="#FFFFFF"/>
      <text x="16" y="192" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">kai</text>
      <text x="16" y="213" fill="#344054" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">verified via 1 hop</text>
    </g>

    <rect x="34" y="432" width="276" height="40" rx="20" fill="#FFFFFF" stroke="#D0D5DD"/>
    <text x="54" y="458" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Message</text>
    <circle cx="286" cy="452" r="15" fill="#00856F"/>
    <path d="M280 452h10M286 446l6 6-6 6" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(548 188)">
    <rect x="0" y="0" width="344" height="512" rx="38" fill="#101828"/>
    <rect x="14" y="18" width="316" height="476" rx="28" fill="#F7F8FA"/>
    <rect x="36" y="44" width="272" height="92" rx="8" fill="#FFFFFF"/>
    <text x="56" y="74" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Peers nearby</text>
    <text x="56" y="104" fill="#475467" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">maya / Connected / Untrusted</text>
    <text x="56" y="124" fill="#475467" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Safety 631 882 410</text>
    <rect x="236" y="83" width="52" height="30" rx="15" fill="#00856F"/>
    <text x="249" y="103" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">DM</text>

    <rect x="36" y="164" width="272" height="180" rx="18" fill="#FFFFFF"/>
    <text x="60" y="204" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Trust maya?</text>
    <text x="60" y="238" fill="#475467" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Compare out of band before</text>
    <text x="60" y="260" fill="#475467" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">trusting this peer key.</text>
    <rect x="60" y="284" width="160" height="34" rx="8" fill="#EBF0FF"/>
    <text x="78" y="307" fill="#263C8A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">631 882 410</text>
    <text x="230" y="307" fill="#00856F" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">Trust</text>

    <rect x="36" y="374" width="272" height="74" rx="8" fill="#FFF7ED"/>
    <text x="56" y="404" fill="#9A3412" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Key changed protection</text>
    <text x="56" y="428" fill="#9A3412" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Direct sends pause until re-trusted.</text>
  </g>

  <g transform="translate(1000 188)">
    <rect x="0" y="0" width="344" height="512" rx="38" fill="#101828"/>
    <rect x="14" y="18" width="316" height="476" rx="28" fill="#F7F8FA"/>
    <rect x="36" y="48" width="272" height="50" rx="25" fill="#E7F7F2"/>
    <circle cx="64" cy="73" r="10" fill="#00856F"/>
    <text x="86" y="80" fill="#006B59" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">Background mesh on</text>

    <rect x="36" y="128" width="272" height="190" rx="8" fill="#FFFFFF"/>
    <text x="56" y="162" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Files</text>
    <g transform="translate(56 184)">
      <rect width="232" height="44" rx="8" fill="#F2F4F7"/>
      <text x="14" y="20" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">route-map.pdf</text>
      <text x="14" y="36" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">2 MB / 9b80d1e6b40a</text>
      <path d="M190 16v12M184 22l6 6 6-6" stroke="#00856F" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M212 26c10 0 16-5 16-14M228 12v10h-10" stroke="#3451B2" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(56 244)">
      <rect width="232" height="44" rx="8" fill="#F2F4F7"/>
      <text x="14" y="20" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">field-notes.txt</text>
      <text x="14" y="36" fill="#667085" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">14 KB / a6120ca78e31</text>
      <path d="M190 16v12M184 22l6 6 6-6" stroke="#00856F" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M212 26c10 0 16-5 16-14M228 12v10h-10" stroke="#3451B2" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <rect x="36" y="352" width="272" height="84" rx="8" fill="#FFFFFF"/>
    <text x="56" y="384" fill="#101828" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Encrypted DM file</text>
    <text x="56" y="410" fill="#475467" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Manifest and chunks travel inside</text>
    <text x="56" y="430" fill="#475467" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">direct packets, not public room payloads.</text>
  </g>
</svg>
